# filename: choir.example.yaml
# Copy to choir.yaml and fill in. Secrets stay in the environment —
# ${VARS} below are expanded at load time.

discord:
  bot_token: ${DISCORD_BOT_TOKEN}   # read-only; the voices post via webhooks
  channel_id: "000000000000000000"
  poll_seconds: 4

# Which backend does the talking: "ollama" (local) or "openrouter" (hosted).
llm:
  provider: ollama

ollama:
  base_url: http://localhost:11434
  model: qwen3:30b-a3b
  temperature: 0.9
  num_predict: 400
  timeout_seconds: 180

  # Appends /no_think for reasoning models like Qwen3. Set false if your
  # model doesn't understand the switch.
  no_think: true

openrouter:
  api_key: ${OPENROUTER_API_KEY}
  # Browse IDs at https://openrouter.ai/models — pick something fast and
  # cheap, this is banter, not research.
  model: mistralai/mistral-nemo
  temperature: 0.9
  max_tokens: 300
  timeout_seconds: 60
  # Optional attribution headers.
  referer: https://github.com/meistro57/channelchoir
  title: ChannelChoir

# Long-term recall. Its OWN Qdrant collection — never point this at
# frontpocket_memory or any other personal corpus, because the voices will
# quote whatever they find, in public. Set enabled: false to run goldfish-mode.
memory:
  enabled: false
  qdrant_url: http://localhost:6333
  collection: choir_memory
  recall_limit: 4
  min_score: 0.45
  timeout_seconds: 30
  embed:
    provider: openrouter          # openrouter | ollama
    model: google/gemini-embedding-2-preview
    vector_size: 3072
    base_url: http://localhost:11434

conductor:
  persona_dir: personas

  # How many recent messages the voices can see.
  transcript_size: 20

  # Hard cap on consecutive bot-only messages. This is the setting that
  # keeps your GPU alive. Raise it slowly.
  max_verse: 6

  # Silence enforced after a verse ends, in seconds. A human speaking
  # clears it immediately.
  rest_seconds: 90

  # Turns a voice must sit out after speaking.
  cooldown_turns: 2

  # Typing-delay range before a chosen voice posts.
  min_delay_seconds: 3
  max_delay_seconds: 12

  # Scoring weights.
  trigger_weight: 0.35
  direct_address_boost: 2.0
  jitter: 0.4

  # Minimum score required to speak at all. 0 means someone always answers.
  # Push toward 0.8 to make the room quieter and moodier.
  speak_threshold: 0.0
